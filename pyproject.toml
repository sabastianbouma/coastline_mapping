[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coastline"
version = "0.1.0"
description = "Coastline extraction experiments using Landsat imagery and the ArcGIS Python API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arcgis",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["coastline*"]